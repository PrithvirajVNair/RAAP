<div class="h-screen flex justify-center items-center bg-[#EFECEC]">
    <div class="flex flex-col gap-5 p-10 text-center bg-white rounded shadow-xl">
        <p class="raap text-[#FFA500] font-bold text-3xl">RAAP</p>
        <h2 class="text-2xl">Create an Account</h2>
        <p>Create Account to access all features!</p>
        <form [formGroup]="registerForm" (ngSubmit)="register()" class="flex flex-col gap-4 mt-5">
            <div>
                <input name="username" formControlName="username" placeholder="Username" class="bg-black/5 px-2 rounded w-full" type="text">
            </div>
            <div>
                <input name="email" formControlName="email" placeholder="Email" class="bg-black/5 px-2 rounded w-full" type="email">
            </div>
            <div>
                <input name="password" formControlName="password" placeholder="Password" class="bg-black/5 px-2 rounded w-full" type="password">
            </div>
            <div>
                <button class="bg-[#FFA000] w-full text-white px-2 py-1 rounded cursor-pointer hover:bg-orange-400">Sign Up</button>
            </div>
            <p>Already have an Account? <a class="text-[#FFA000] hover:underline" routerLink="/login">Sign In</a></p>
        </form>
    </div>
</div>
