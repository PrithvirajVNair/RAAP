<div class="fixed top-0 left-0 w-[16.66%] min-h-screen flex flex-col justify-center items-center pt-20 bg-[#FFA000]/5 gap-3">

  <button
    routerLink="/home"
    routerLinkActive="!bg-[#FFA000] !text-white"
    [routerLinkActiveOptions]="{ exact: true }"
    class="bg-black/10 text-black hover:bg-black/20 px-2 py-1 rounded w-50 cursor-pointer transition">
    Home
  </button>

  <button
    routerLink="/risks"
    routerLinkActive="!bg-[#FFA000] !text-white"
    class="bg-black/10 text-black hover:bg-black/20 px-2 py-1 rounded w-50 cursor-pointer transition">
    Risks
  </button>

  <button
    routerLink="/users"
    routerLinkActive="!bg-[#FFA000] !text-white"
    class="bg-black/10 text-black hover:bg-black/20 px-2 py-1 rounded w-50 cursor-pointer transition">
    Users
  </button>

  <button
    routerLink="/settings"
    routerLinkActive="!bg-[#FFA000] !text-white"
    class="bg-black/10 text-black hover:bg-black/20 px-2 py-1 rounded w-50 cursor-pointer transition">
    Settings
  </button>

</div>
