<div class="grid grid-cols-6 pt-20">

        <app-sidebar></app-sidebar>
    </div>
    <div class="col-span-5 p-5 flex flex-col gap-5 w-full">
        <h1 class="text-2xl text-center text-[#FFA000]">Users</h1>
        <div class="rounded-xl overflow-hidden">
            <table class="w-full">
                <thead class="">
                    <tr class="bg-[#FFA000]/20">

                    </tr>}
                </tbody>
